name: Tests

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash
jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        version: [latest]

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup score-compose
      uses: ./
      with:
        file: score-compose
        version: ${{ matrix.version }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup score-k8s
      uses: ./
      with:
        file: score-k8s
        version: ${{ matrix.version }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify installation
      run: |
        export SCORE_CS_VERSION=$( score-compose --version )
        export SCORE_KS_VERSION=$( score-k8s --version )
